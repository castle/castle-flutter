version: 2.1

jobs:
  test:
    docker:
      - image: ghcr.io/cirruslabs/flutter:stable
    steps:
      - checkout
      - run: flutter doctor
      - run: flutter test --coverage
      - run:
          name: Report coverage
          command: |
            awk -F: '/^LF:/ {found += $2} /^LH:/ {hit += $2}
                     END {
                       if (found == 0) { print "No coverage data."; exit }
                       printf "Lines covered: %d/%d (%.1f%%)\n", hit, found, 100 * hit / found
                     }' coverage/lcov.info
      - store_artifacts:
          path: coverage/lcov.info
          destination: coverage/lcov.info

  ios_build:
    macos:
      xcode: "26.5"
    working_directory: /Users/distiller/castle_flutter
    steps:
      - checkout

      - restore_cache:
          name: Restore Flutter SDK cache
          keys:
            - flutter-sdk-stable-v1
      - run:
          name: Install or update Flutter
          command: |
            if [ ! -d "$HOME/flutter/.git" ]; then
              git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$HOME/flutter"
            else
              git -C "$HOME/flutter" pull --ff-only origin stable
            fi
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> "$BASH_ENV"
      - run: flutter --version
      # castle_flutter is Swift Package Manager only, so SPM has to be enabled
      # before `flutter pub get` — it fails to resolve the plugin otherwise.
      - run: flutter config --enable-swift-package-manager
      - run: flutter precache --ios
      - save_cache:
          name: Save Flutter SDK cache
          paths:
            - ~/flutter
          key: flutter-sdk-stable-v1

      - restore_cache:
          name: Restore Pub cache
          keys:
            - pub-cache-v1-{{ checksum "example/pubspec.lock" }}
            - pub-cache-v1-
      - run:
          name: Fetch dependencies
          working_directory: example
          command: flutter pub get
      - save_cache:
          name: Save Pub cache
          paths:
            - ~/.pub-cache
          key: pub-cache-v1-{{ checksum "example/pubspec.lock" }}

      - restore_cache:
          name: Restore SPM cache
          keys:
            - spm-v1-{{ checksum "ios/castle_flutter/Package.swift" }}
            - spm-v1-
      - run:
          name: Build iOS with Swift Package Manager
          working_directory: example
          command: flutter build ios --no-codesign --debug
      - save_cache:
          name: Save SPM cache
          paths:
            - ~/Library/Caches/org.swift.swiftpm
          key: spm-v1-{{ checksum "ios/castle_flutter/Package.swift" }}

workflows:
  build:
    jobs:
      - test
      - ios_build
