description: Castle Flutter plugin.
name: castle_flutter
version: 4.0.0
homepage: https://github.com/castle/castle-flutter

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  coverage: "^1.0.1"
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.castle.flutter.castle_flutter
        pluginClass: CastleFlutterPlugin
      ios:
        pluginClass: CastleFlutterPlugin
